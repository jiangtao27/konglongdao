<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>恐龙岛：生存进化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        html, body {
            background: #0a0a14;
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        #gameBox {
            position: relative;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #0a0a14;
        }
        canvas { 
            display: block; 
            background: #1a3a1a; 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%; max-height: 100%;
        }
        
        /* UI Layer */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 10px 14px; pointer-events: none;
            display: flex; justify-content: space-between;
            z-index: 10;
        }
        .ui-panel {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            border-radius: 10px; padding: 6px 12px;
            color: #fff; font-size: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .bar {
            width: 80px; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden;
            position: relative;
        }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.25s cubic-bezier(0.4,0,0.2,1); }
        .hp-fill { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); box-shadow: 0 0 10px rgba(255,107,107,0.3); }
        .energy-fill { background: linear-gradient(90deg, #feca57, #ff9f43); box-shadow: 0 0 10px rgba(254,202,87,0.3); }
        .xp-fill { background: linear-gradient(90deg, #a29bfe, #6c5ce7); box-shadow: 0 0 10px rgba(162,155,254,0.3); }
        
        /* Overlays */
        .overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(5,10,5,0.94);
            z-index: 50;
            transition: opacity 0.4s;
            padding: 20px;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        #overScreen { display: none; }
        #overScreen.active { display: flex; }
        
        .game-title {
            font-size: clamp(32px, 8vw, 56px); font-weight: 900;
            background: linear-gradient(180deg, #55efc4, #00b894);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 30px rgba(0,184,148,0.2);
            letter-spacing: 4px; margin-bottom: 8px;
            text-align: center;
        }
        .game-sub {
            color: #636e72; font-size: clamp(12px, 3.5vw, 16px);
            margin-bottom: 30px; letter-spacing: 2px;
            text-align: center;
        }
        .btn {
            padding: 14px 40px; font-size: 16px;
            border: none; border-radius: 30px;
            cursor: pointer; font-family: inherit;
            font-weight: bold; letter-spacing: 3px;
            transition: all 0.3s; pointer-events: all;
            position: relative; overflow: hidden;
            min-width: 180px;
        }
        .btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .btn:hover::after, .btn:active::after { transform: translateX(100%); }
        .btn-green {
            background: linear-gradient(135deg, #00b894, #55efc4);
            color: #0a0a14; box-shadow: 0 4px 25px rgba(0,184,148,0.4);
        }
        .btn-green:active { transform: scale(0.95); }
        .btn-red {
            background: linear-gradient(135deg, #d63031, #ff7675);
            color: white; box-shadow: 0 4px 25px rgba(214,48,49,0.4);
        }
        .btn-red:active { transform: scale(0.95); }
        
        .controls {
            margin-top: 24px; color: #74b9ff;
            font-size: 12px; text-align: center; line-height: 2.2;
        }
        .key {
            display: inline-block; background: rgba(255,255,255,0.06);
            padding: 2px 8px; border-radius: 4px;
            color: #dfe6e9; font-family: monospace; margin: 0 2px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Toast */
        #toast {
            position: absolute; top: 55px; left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(0,0,0,0.85);
            color: #ffeaa7; padding: 8px 18px;
            border-radius: 20px; font-size: 13px;
            opacity: 0; transition: all 0.3s;
            pointer-events: none; white-space: nowrap;
            border: 1px solid rgba(255,234,167,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-weight: 500; z-index: 20;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        /* Stats Grid */
        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin: 15px 0; text-align: center;
            max-width: 300px; width: 100%;
        }
        .stat-item { color: #b2bec3; font-size: 13px; }
        .stat-num { color: #fdcb6e; font-size: 26px; font-weight: bold; margin-top: 4px; }
        
        /* Combo Display */
        #comboDisplay {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(32px, 10vw, 48px); font-weight: 900;
            color: #fdcb6e; pointer-events: none;
            opacity: 0; text-shadow: 0 0 30px rgba(253,203,110,0.5);
            transition: all 0.3s; z-index: 20;
        }
        #comboDisplay.show { opacity: 1; animation: comboPop 0.5s ease-out; }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Damage Numbers */
        .damage-num {
            position: absolute; pointer-events: none;
            font-weight: bold; font-size: 16px;
            animation: floatUp 1s ease-out forwards;
            z-index: 15; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        
        /* Sound Toggle */
        #soundToggle {
            position: absolute; bottom: 10px; right: 10px;
            z-index: 20; pointer-events: all;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 6px 12px;
            border-radius: 16px; cursor: pointer;
            font-size: 11px; backdrop-filter: blur(8px);
        }
        
        /* Screen Shake */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-3px, -3px); }
            20% { transform: translate(3px, 3px); }
            30% { transform: translate(-3px, 3px); }
            40% { transform: translate(3px, -3px); }
            50% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, -2px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
        
        /* Level Up Flash */
        @keyframes levelFlash {
            0% { box-shadow: inset 0 0 0 rgba(253,203,110,0); }
            50% { box-shadow: inset 0 0 80px rgba(253,203,110,0.3); }
            100% { box-shadow: inset 0 0 0 rgba(253,203,110,0); }
        }
        .level-up-flash { animation: levelFlash 0.6s ease-out; }
        
        /* ========== 手机虚拟摇杆 & 按钮 ========== */
        .mobile-controls { display: none; }
        
        @media (hover: none) and (pointer: coarse), (max-width: 768px) {
            .mobile-controls { display: block; }
            #ui { padding: 8px 10px; }
            .ui-panel { padding: 4px 8px; font-size: 11px; }
            .bar { width: 60px; height: 6px; }
            .controls { display: none; }
        }
        
        /* 虚拟摇杆 */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px;
            width: 140px; height: 140px; z-index: 30;
            pointer-events: all; touch-action: none;
        }
        #joystick-base {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 56px; height: 56px;
            margin: -28px 0 0 -28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.05s;
        }
        #joystick-knob.active {
            background: rgba(0,184,148,0.4);
            border-color: rgba(85,239,196,0.6);
        }
        
        /* 右侧按钮组 */
        #action-buttons {
            position: absolute; bottom: 20px; right: 20px;
            z-index: 30; display: flex; flex-direction: column; gap: 12px;
            align-items: flex-end; pointer-events: none;
        }
        .action-btn {
            pointer-events: all;
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            color: #fff; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.1s; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active {
            transform: scale(0.88);
            background: rgba(255,255,255,0.25);
        }
        #btn-atk {
            width: 84px; height: 84px;
            background: rgba(231, 76, 60, 0.25);
            border-color: rgba(231, 76, 60, 0.4);
            font-size: 15px;
        }
        #btn-atk:active {
            background: rgba(231, 76, 60, 0.45);
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.4);
        }
        #btn-sprint {
            background: rgba(254, 202, 87, 0.2);
            border-color: rgba(254, 202, 87, 0.35);
            color: #feca57;
        }
        #btn-sprint.active {
            background: rgba(254, 202, 87, 0.45);
            box-shadow: 0 0 20px rgba(254, 202, 87, 0.3);
        }
        
        /* 横屏提示 */
        #rotate-hint {
            display: none; position: fixed; inset: 0;
            background: #0a0a14; z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; padding: 20px;
        }
        #rotate-hint svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.7; }
        @media screen and (orientation: portrait) and (max-width: 600px) {
            #rotate-hint { display: flex; }
        }
    </style>
</head>
<body>
    <!-- 横屏提示 -->
    <div id="rotate-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="10" rx="2"/>
            <path d="M8 20h8M12 14v6"/>
            <path d="M20 9l2-2M4 9L2 7"/>
        </svg>
        <div style="font-size:20px;font-weight:bold;margin-bottom:8px;">请旋转手机</div>
        <div style="color:#74b9ff;font-size:14px;">横屏体验更佳</div>
    </div>

    <div id="gameBox">
        <canvas id="c"></canvas>
        
        <!-- 虚拟摇杆 -->
        <div class="mobile-controls" id="joystick-zone">
            <div id="joystick-base"></div>
            <div id="joystick-knob"></div>
        </div>
        
        <!-- 右侧按钮 -->
        <div class="mobile-controls" id="action-buttons">
            <div class="action-btn" id="btn-sprint">冲刺</div>
            <div class="action-btn" id="btn-atk">攻击</div>
        </div>
        
        <div id="ui">
            <div style="display:flex;gap:8px;flex-direction:column;">
                <div class="ui-panel" id="hpPanel">
                    <span style="color:#ff6b6b;font-size:16px;">♥</span>
                    <div class="bar"><div class="bar-fill hp-fill" id="hpBar" style="width:100%"></div></div>
                    <span id="hpText" style="min-width:32px;text-align:right;font-weight:bold;">100</span>
                </div>
                <div class="ui-panel">
                    <span style="color:#feca57;font-size:16px;">⚡</span>
                    <div class="bar"><div class="bar-fill energy-fill" id="enBar" style="width:100%"></div></div>
                </div>
                <div class="ui-panel" style="padding:3px 8px;">
                    <span style="color:#a29bfe;font-size:11px;">EXP</span>
                    <div class="bar" style="width:70px;height:5px;"><div class="bar-fill xp-fill" id="xpBar" style="width:0%"></div></div>
                </div>
            </div>
            <div style="display:flex;gap:8px;flex-direction:column;align-items:flex-end;">
                <div class="ui-panel">
                    <span style="color:#a29bfe;">LV.</span>
                    <span id="lvl" style="font-weight:bold;font-size:16px;">1</span>
                </div>
                <div class="ui-panel">
                    <span style="color:#fdcb6e;">★</span>
                    <span id="score" style="font-weight:bold;font-size:14px;">0</span>
                </div>
                <div class="ui-panel" id="comboPanel" style="opacity:0;transition:opacity 0.3s;">
                    <span style="color:#ff7675;">🔥</span>
                    <span id="comboCount" style="font-weight:bold;color:#ff7675;">0</span>
                    <span style="font-size:10px;color:#b2bec3;">连击</span>
                </div>
            </div>
        </div>
        
        <div id="toast"></div>
        <div id="comboDisplay"></div>
        <button id="soundToggle">🔊 音效: 开</button>
        
        <div id="overlay" class="overlay">
            <div class="game-title">恐龙岛：生存进化</div>
            <div class="game-sub">手绘恐龙 · 开放世界 · 生存进化</div>
            <button class="btn btn-green" id="startBtn">进入岛屿</button>
            <div class="controls">
                <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动 &nbsp;
                <span class="key">空格</span> 冲刺 &nbsp;
                <span class="key">J</span> 攻击<br>
                收集浆果和水晶，击败掠食者，进化你的恐龙！
            </div>
            <div style="margin-top:16px;color:#636e72;font-size:12px;text-align:center;line-height:1.8;">
                📱 手机端：左侧摇杆移动<br>
                右侧按钮攻击 / 冲刺
            </div>
        </div>
        
        <div id="overScreen" class="overlay">
            <div style="font-size:clamp(28px,7vw,44px);color:#ff7675;margin-bottom:10px;font-weight:900;">你倒下了</div>
            <div class="stat-grid">
                <div class="stat-item">得分<div class="stat-num" id="endScore">0</div></div>
                <div class="stat-item">等级<div class="stat-num" id="endLvl">1</div></div>
                <div class="stat-item">击杀<div class="stat-num" id="endKill">0</div></div>
                <div class="stat-item">生存<div class="stat-num" id="endTime">0s</div></div>
                <div class="stat-item">最高连击<div class="stat-num" id="endCombo">0</div></div>
                <div class="stat-item">水晶<div class="stat-num" id="endCrystal">0</div></div>
            </div>
            <button class="btn btn-red" id="restartBtn">重新开始</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 960, H = 640;
const gameBox = document.getElementById('gameBox');

// ========== 响应式画布 ==========
function resizeCanvas() {
    const aspect = 960 / 640;
    let w = window.innerWidth;
    let h = window.innerHeight;
    
    if (w / h > aspect) {
        w = h * aspect;
    } else {
        h = w / aspect;
    }
    
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = 960;
    canvas.height = 640;
    W = 960; H = 640;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ========== 音频系统 ==========
const AudioSys = {
    ctx: null, enabled: true, bgmOsc: null, bgmGain: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    toggle() {
        this.enabled = !this.enabled;
        document.getElementById('soundToggle').textContent = this.enabled ? '🔊 音效: 开' : '🔇 音效: 关';
        if (!this.enabled && this.bgmGain) {
            this.bgmGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
        } else if (this.enabled && this.bgmGain) {
            this.bgmGain.gain.setTargetAtTime(0.08, this.ctx.currentTime, 0.1);
        }
        return this.enabled;
    },
    playHit() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.15);
        const bufferSize = this.ctx.sampleRate * 0.1;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.1, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        noise.connect(noiseGain).connect(this.ctx.destination);
        noise.start(t);
    },
    playCollect() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + i * 0.05);
            gain.gain.setValueAtTime(0.15, t + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.05 + 0.2);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t + i * 0.05); osc.stop(t + i * 0.05 + 0.2);
        });
    },
    playCrystal() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        [880, 1100, 1320, 1760].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + i * 0.06);
            gain.gain.setValueAtTime(0.12, t + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.06 + 0.4);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.4);
        });
    },
    playHurt() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.3);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.3);
    },
    playLevelUp() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t + i * 0.12);
            gain.gain.setValueAtTime(0.2, t + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.12 + 0.4);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.4);
        });
    },
    playDeath() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.4);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.4);
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.15, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        noise.connect(noiseGain).connect(this.ctx.destination);
        noise.start(t);
    },
    playStep() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.08);
    },
    startBGM() {
        if (!this.enabled || !this.ctx) return;
        if (this.bgmOsc) return;
        const t = this.ctx.currentTime;
        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.setValueAtTime(0.08, t);
        this.bgmGain.connect(this.ctx.destination);
        const createDrone = (freq, detune) => {
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            osc.detune.setValueAtTime(detune, t);
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.5, t);
            osc.connect(g).connect(this.bgmGain);
            osc.start(t);
            return osc;
        };
        this.bgmOsc = [createDrone(55, 0), createDrone(55.5, 10), createDrone(110, 0)];
        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(0.5, t);
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.setValueAtTime(0.03, t);
        lfo.connect(lfoGain).connect(this.bgmGain.gain);
        lfo.start(t);
        this.bgmOsc.push(lfo);
    },
    stopBGM() {
        if (this.bgmOsc) {
            this.bgmOsc.forEach(o => { try { o.stop(); } catch(e) {} });
            this.bgmOsc = null;
        }
    }
};

// ========== 虚拟摇杆系统 ==========
const joystick = {
    active: false,
    originX: 0, originY: 0,
    dx: 0, dy: 0,
    maxDist: 50
};
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

function getTouchPos(el, touch) {
    const rect = el.getBoundingClientRect();
    return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
    };
}

joystickZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    const pos = getTouchPos(joystickZone, touch);
    joystick.active = true;
    joystick.originX = pos.x;
    joystick.originY = pos.y;
    joystickKnob.classList.add('active');
    updateJoystick(pos.x, pos.y);
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!joystick.active) return;
    const touch = e.changedTouches[0];
    const pos = getTouchPos(joystickZone, touch);
    updateJoystick(pos.x, pos.y);
}, { passive: false });

function updateJoystick(x, y) {
    let dx = x - joystick.originX;
    let dy = y - joystick.originY;
    const dist = Math.hypot(dx, dy);
    if (dist > joystick.maxDist) {
        dx = (dx / dist) * joystick.maxDist;
        dy = (dy / dist) * joystick.maxDist;
    }
    joystick.dx = dx / joystick.maxDist;
    joystick.dy = dy / joystick.maxDist;
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}

function endJoystick() {
    joystick.active = false;
    joystick.dx = 0; joystick.dy = 0;
    joystickKnob.style.transform = 'translate(0,0)';
    joystickKnob.classList.remove('active');
}

joystickZone.addEventListener('touchend', e => { e.preventDefault(); endJoystick(); });
joystickZone.addEventListener('touchcancel', e => { e.preventDefault(); endJoystick(); });

    ctx.moveTo(3, 0);
    ctx.quadraticCurveTo(5 + wind * 4, -5, 3 + wind * 6, -8);
    ctx.stroke();
    
    ctx.restore();
}

// ========== 玩家 ==========
const player = {
    x: WORLD.w / 2, y: WORLD.h / 2,
    w: 30, h: 30,
    hp: 100, maxHp: 100,
    energy: 100,
    dir: 'right',
    moving: false,
    anim: 0,
    atkCooldown: 0,
    invincible: 0,
    dmg: 15,
    stepTimer: 0
};

// ========== 对象池 ==========
let berries = [], crystals = [], enemies = [], treesArr = [], rocks = [], particles = [];
let flowers = [], grasses = [];

function initWorld() {
    berries = []; crystals = []; enemies = []; treesArr = []; rocks = []; particles = [];
    flowers = []; grasses = [];
    
    for (let i = 0; i < 120; i++) {
        treesArr.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50),
            type: Math.random() > 0.5 ? 'palm' : 'pine',
            swayOffset: Math.random() * Math.PI * 2
        });
    }
    for (let i = 0; i < 40; i++) {
        rocks.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50),
            size: rand(12, 28)
        });
    }
    for (let i = 0; i < 80; i++) {
        flowers.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50),
            type: Math.floor(Math.random() * 4)
        });
    }
    for (let i = 0; i < 200; i++) {
        grasses.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50)
        });
    }
    for (let i = 0; i < 25; i++) spawnBerry();
    for (let i = 0; i < 8; i++) spawnCrystal();
    for (let i = 0; i < 5; i++) spawnEnemy();
}

function spawnBerry() {
    berries.push({ x: rand(50, WORLD.w - 50), y: rand(50, WORLD.h - 50), heal: 8, xp: 5 });
}
function spawnCrystal() {
    crystals.push({ x: rand(50, WORLD.w - 50), y: rand(50, WORLD.h - 50), xp: 30, score: 50 });
}
function spawnEnemy() {
    let ex, ey;
    do {
        ex = rand(50, WORLD.w - 50);
        ey = rand(50, WORLD.h - 50);
    } while (dist({x: ex, y: ey}, player) < 400);
    
    const isTrex = Math.random() < 0.25 + level * 0.05;
    enemies.push({
        x: ex, y: ey,
        w: isTrex ? 50 : 35, h: isTrex ? 50 : 35,
        hp: isTrex ? 80 + level * 15 : 30 + level * 8,
        maxHp: isTrex ? 80 + level * 15 : 30 + level * 8,
        speed: isTrex ? 1.8 : 2.8 + level * 0.1,
        type: isTrex ? 'trex' : 'raptor',
        dir: 'left',
        anim: Math.random() * 10,
        atkCd: 0,
        dmg: isTrex ? 20 : 10,
        flash: 0
    });
}

// ========== 粒子 ==========
function addParticles(x, y, color, count, speed = 3, life = 1) {
    for (let i = 0; i < count; i++) {
        const ang = rand(0, Math.PI * 2);
        const sp = rand(1, speed);
        particles.push({
            x, y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp,
            life: life,
            decay: rand(0.02, 0.05),
            color, size: rand(2, 5),
            gravity: 0.08
        });
    }
}

// ========== 更新 ==========
function update() {
    if (state !== 'playing') return;
    frame++;
    surviveTime++;
    
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
            combo = 0;
            document.getElementById('comboPanel').style.opacity = '0';
        }
    }
    
    if (camShake.intensity > 0) {
        camShake.x = (Math.random() - 0.5) * camShake.intensity;
        camShake.y = (Math.random() - 0.5) * camShake.intensity;
        camShake.intensity *= 0.9;
        if (camShake.intensity < 0.5) camShake.intensity = 0;
    } else {
        camShake.x = 0; camShake.y = 0;
    }
    
    // 合并键盘和摇杆输入
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    
    // 摇杆输入
    if (joystick.active) {
        dx = joystick.dx;
        dy = joystick.dy;
    }
    
    const sprinting = (keys[' '] || mobileKeys.sprint) && player.energy > 0;
    if (sprinting) player.energy = Math.max(0, player.energy - 1.2);
    else player.energy = Math.min(100, player.energy + 0.4);
    
    const spd = sprinting ? 5 : 3;
    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
        const len = Math.hypot(dx, dy);
        if (len > 1) { dx /= len; dy /= len; }
        player.x = clamp(player.x + dx * spd, 20, WORLD.w - 20);
        player.y = clamp(player.y + dy * spd, 20, WORLD.h - 20);
        player.moving = true;
        if (dx > 0.1) player.dir = 'right';
        if (dx < -0.1) player.dir = 'left';
        player.anim += 0.016;
        
        player.stepTimer++;
        if (player.stepTimer > (sprinting ? 8 : 12)) {
            player.stepTimer = 0;
            AudioSys.playStep();
        }
    } else {
        player.moving = false;
        player.stepTimer = 0;
    }
    
    // 攻击（键盘J或手机按钮）
    if ((keys['j'] || mobileKeys.atk) && player.atkCooldown <= 0) {
        player.atkCooldown = 22;
        AudioSys.playHit();
        
        const atkRange = 65;
        const ax = player.x + (player.dir === 'right' ? 30 : -30);
        const ay = player.y;
        
        let hitSomething = false;
        enemies.forEach((e, i) => {
            if (dist({x: ax, y: ay}, e) < atkRange) {
                hitSomething = true;
                e.hp -= player.dmg;
                e.flash = 6;
                addParticles(e.x, e.y, '#ff6b6b', 10, 4);
                
                const isCrit = Math.random() < 0.15;
                const dmg = isCrit ? Math.floor(player.dmg * 1.5) : player.dmg;
                if (isCrit) e.hp -= Math.floor(player.dmg * 0.5);
                addDamageNumber(e.x, e.y - 20, isCrit ? `暴击 ${dmg}!` : `-${dmg}`, isCrit ? '#fdcb6e' : '#ff7675');
                
                const ang = Math.atan2(e.y - player.y, e.x - player.x);
                e.x += Math.cos(ang) * 35;
                e.y += Math.sin(ang) * 35;
                
                if (e.hp <= 0) {
                    kills++;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    comboTimer = 180;
                    
                    const comboBonus = Math.min(combo * 5, 50);
                    score += (e.type === 'trex' ? 100 : 40) + comboBonus;
                    xp += e.type === 'trex' ? 50 : 20;
                    
                    addParticles(e.x, e.y, '#fdcb6e', 20, 5);
                    AudioSys.playDeath();
                    toast(`${e.type === 'trex' ? '霸王龙' : '迅猛龙'} 被击败！${combo > 1 ? ` ${combo}连击!` : ''}`);
                    
                    if (combo >= 3) {
                        document.getElementById('comboPanel').style.opacity = '1';
                        document.getElementById('comboCount').textContent = combo;
                        const cd = document.getElementById('comboDisplay');
                        cd.textContent = `${combo} 连击!`;
                        cd.classList.add('show');
                        setTimeout(() => cd.classList.remove('show'), 800);
                    }
                    
                    enemies.splice(i, 1);
                    screenShake(6);
                }
            }
        });
        
        if (!hitSomething) {
            addParticles(ax, ay, 'rgba(255,255,255,0.5)', 4, 2);
        }
    }
    if (player.atkCooldown > 0) player.atkCooldown--;
    if (player.invincible > 0) player.invincible--;
    
    const targetCamX = player.x - W / 2;
    const targetCamY = player.y - H / 2;
    cam.x += (targetCamX - cam.x) * 0.12;
    cam.y += (targetCamY - cam.y) * 0.12;
    cam.x = clamp(cam.x, 0, WORLD.w - W);
    cam.y = clamp(cam.y, 0, WORLD.h - H);
    
    for (let i = berries.length - 1; i >= 0; i--) {
        if (dist(player, berries[i]) < 32) {
            player.hp = Math.min(player.maxHp, player.hp + berries[i].heal);
            xp += berries[i].xp;
            score += 10;
            addParticles(berries[i].x, berries[i].y, '#ff6b6b', 8, 3);
            AudioSys.playCollect();
            toast(`+${berries[i].xp} XP  +${berries[i].heal} HP`);
            berries.splice(i, 1);
        }
    }
    for (let i = crystals.length - 1; i >= 0; i--) {
        if (dist(player, crystals[i]) < 32) {
            xp += crystals[i].xp;
            score += crystals[i].score;
            crystalsCollected++;
            addParticles(crystals[i].x, crystals[i].y, '#a29bfe', 15, 4);
            AudioSys.playCrystal();
            toast(`💎 +${crystals[i].score} 分！`);
            crystals.splice(i, 1);
        }
    }
    
    enemies.forEach(e => {
        const d = dist(player, e);
        e.anim += 0.016;
        if (e.flash > 0) e.flash--;
        
        if (d < 400) {
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(ang) * e.speed;
            e.y += Math.sin(ang) * e.speed;
            e.dir = Math.cos(ang) > 0 ? 'right' : 'left';
            
            if (d < 38 && e.atkCd <= 0 && player.invincible <= 0) {
                player.hp -= e.dmg;
                player.invincible = 60;
                e.atkCd = 45;
                addParticles(player.x, player.y, '#ff7675', 12, 4);
                AudioSys.playHurt();
                toast(`受到 ${e.dmg} 点伤害！`);
                screenShake(8);
                gameBox.classList.add('shake');
                setTimeout(() => gameBox.classList.remove('shake'), 300);
            }
        } else {
            e.x += Math.cos(e.anim) * e.speed * 0.3;
            e.y += Math.sin(e.anim * 0.7) * e.speed * 0.3;
            e.dir = Math.cos(e.anim) > 0 ? 'right' : 'left';
        }
        if (e.atkCd > 0) e.atkCd--;
        
        e.x = clamp(e.x, 20, WORLD.w - 20);
        e.y = clamp(e.y, 20, WORLD.h - 20);
    });
    
    if (xp >= xpNeed) {
        level++;
        xp -= xpNeed;
        xpNeed = Math.floor(xpNeed * 1.35);
        player.maxHp += 15;
        player.hp = player.maxHp;
        player.dmg += 4;
        AudioSys.playLevelUp();
        toast(`🎉 升级到 Lv.${level}！全属性提升！`);
        addParticles(player.x, player.y, '#fdcb6e', 25, 6);
        gameBox.classList.add('level-up-flash');
        setTimeout(() => gameBox.classList.remove('level-up-flash'), 600);
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0.1;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    if (frame % 120 === 0 && berries.length < 30) spawnBerry();
    if (frame % 350 === 0 && crystals.length < 10) spawnCrystal();
    if (frame % 200 === 0 && enemies.length < 6 + level * 0.8) spawnEnemy();
    
    if (player.hp <= 0) {
        state = 'over';
        AudioSys.stopBGM();
        document.getElementById('endScore').textContent = score;
        document.getElementById('endLvl').textContent = level;
        document.getElementById('endKill').textContent = kills;
        document.getElementById('endTime').textContent = Math.floor(surviveTime / 60) + 's';
        document.getElementById('endCombo').textContent = maxCombo;
        document.getElementById('endCrystal').textContent = crystalsCollected;
        document.getElementById('overScreen').classList.add('active');
    }
    
    document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('hpText').textContent = Math.ceil(player.hp);
    document.getElementById('enBar').style.width = player.energy + '%';
    document.getElementById('xpBar').style.width = (xp / xpNeed * 100) + '%';
    document.getElementById('lvl').textContent = level;
    document.getElementById('score').textContent = score;
}

// ========== 绘制 ==========
function draw() {
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = 'rgba(46, 125, 50, 0.25)';
    for (let x = -((cam.x + camShake.x) % 80); x < W; x += 80) {
        for (let y = -((cam.y + camShake.y) % 80); y < H; y += 80) {
            if ((Math.floor((x + cam.x) / 80) + Math.floor((y + cam.y) / 80)) % 2 === 0) {
                ctx.fillRect(x, y, 40, 40);
            }
        }
    }
    
    ctx.save();
    ctx.translate(-cam.x - camShake.x, -cam.y - camShake.y);
    
    ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)';
    ctx.lineWidth = 5;
    ctx.setLineDash([16, 10]);
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
    ctx.setLineDash([]);
    
    grasses.forEach(g => {
        if (g.y < player.y - 50) drawGrass(ctx, g.x, g.y, frame * 0.05);
    });
    flowers.forEach(f => {
        if (f.y < player.y - 20) drawFlower(ctx, f.x, f.y, frame * 0.05, f.type);
    });
    treesArr.forEach(t => {
        if (t.y < player.y) drawTree(ctx, t.x, t.y, t.type, t.swayOffset);
    });
    rocks.forEach(r => drawRock(ctx, r.x, r.y, r.size));
    berries.forEach(b => drawBerry(ctx, b.x, b.y, frame * 0.05));
    crystals.forEach(c => drawCrystal(ctx, c.x, c.y, frame * 0.05));
    
    enemies.forEach(e => {
        if (e.flash > 0 && Math.floor(e.flash / 2) % 2 === 0) ctx.globalAlpha = 0.5;
        drawDino(ctx, e.x, e.y, e.dir, e.anim, e.type);
        ctx.globalAlpha = 1;
        
        const hpPct = e.hp / e.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(e.x - 20, e.y - 38, 40, 5);
        ctx.fillStyle = hpPct > 0.5 ? '#00b894' : hpPct > 0.25 ? '#fdcb6e' : '#d63031';
        ctx.fillRect(e.x - 20, e.y - 38, 40 * hpPct, 5);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(e.x - 20, e.y - 38, 40 * hpPct, 2);
    });
    
    if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
        drawDino(ctx, player.x, player.y, player.dir, player.anim, 'player');
        
        if (player.atkCooldown > 16) {
            ctx.save();
            ctx.translate(player.x, player.y);
            const ax = player.dir === 'right' ? 38 : -38;
            ctx.strokeStyle = `rgba(255,255,255,${(player.atkCooldown - 16) / 9 * 0.8})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ax, -5, 28, -0.5, 0.5);
            ctx.stroke();
            ctx.strokeStyle = `rgba(255,255,255,${(player.atkCooldown - 16) / 9 * 0.4})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ax - 15, -20);
            ctx.lineTo(ax + 20, 5);
            ctx.stroke();
            ctx.restore();
        }
    }
    
    flowers.forEach(f => {
        if (f.y >= player.y - 20) drawFlower(ctx, f.x, f.y, frame * 0.05, f.type);
    });
    grasses.forEach(g => {
        if (g.y >= player.y - 50) drawGrass(ctx, g.x, g.y, frame * 0.05);
    });
    treesArr.forEach(t => {
        if (t.y >= player.y) drawTree(ctx, t.x, t.y, t.type, t.swayOffset);
    });
    
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    ctx.restore();
    
    drawMinimap();
    
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
}

function drawMinimap() {
    const mx = W - 130, my = H - 130, mw = 110, mh = 110;
    
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.roundRect(mx - 6, my - 6, mw + 12, mh + 12, 8);
    ctx.fill();
    
    ctx.fillStyle = '#1a3a1a';
    ctx.beginPath();
    ctx.roundRect(mx, my, mw, mh, 6);
    ctx.fill();
    
    const sx = mw / WORLD.w, sy = mh / WORLD.h;
    
    ctx.fillStyle = 'rgba(46, 204, 113, 0.3)';
    treesArr.forEach(t => {
        ctx.fillRect(mx + t.x * sx, my + t.y * sy, 1.5, 1.5);
    });
    
    ctx.fillStyle = '#55efc4';
    ctx.beginPath();
    ctx.arc(mx + player.x * sx, my + player.y * sy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    enemies.forEach(e => {
        ctx.fillStyle = e.type === 'trex' ? '#d63031' : '#e17055';
        ctx.beginPath();
        ctx.arc(mx + e.x * sx, my + e.y * sy, e.type === 'trex' ? 3 : 2, 0, Math.PI * 2);
        ctx.fill();
    });
    
    ctx.fillStyle = '#fdcb6e';
    berries.forEach(b => {
        ctx.fillRect(mx + b.x * sx - 0.5, my + b.y * sy - 0.5, 1.5, 1.5);
    });
    ctx.fillStyle = '#a29bfe';
    crystals.forEach(c => {
        ctx.fillRect(mx + c.x * sx - 1, my + c.y * sy - 1, 2.5, 2.5);
    });
    
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(mx + cam.x * sx, my + cam.y * sy, W * sx, H * sy);
}

// ========== 循环 ==========
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// ========== 开始 ==========
document.getElementById('startBtn').addEventListener('click', () => {
    AudioSys.init();
    AudioSys.startBGM();
    document.getElementById('overlay').classList.add('hidden');
    state = 'playing';
    initWorld();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    location.reload();
});

loop();
</script>
