<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙岛：生存进化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #gameBox {
            position: relative;
            box-shadow: 0 0 80px rgba(0,200,100,0.15), 0 0 0 1px rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { display: block; background: #1a3a1a; cursor: crosshair; }
        
        /* UI Layer */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 14px 20px; pointer-events: none;
            display: flex; justify-content: space-between;
            z-index: 10;
        }
        .ui-panel {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            border-radius: 10px; padding: 8px 16px;
            color: #fff; font-size: 13px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .bar {
            width: 120px; height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px; overflow: hidden;
            position: relative;
        }
        .bar-fill { height: 100%; border-radius: 5px; transition: width 0.25s cubic-bezier(0.4,0,0.2,1); }
        .hp-fill { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); box-shadow: 0 0 10px rgba(255,107,107,0.3); }
        .energy-fill { background: linear-gradient(90deg, #feca57, #ff9f43); box-shadow: 0 0 10px rgba(254,202,87,0.3); }
        .xp-fill { background: linear-gradient(90deg, #a29bfe, #6c5ce7); box-shadow: 0 0 10px rgba(162,155,254,0.3); }
        
        .xp-bar-wrap {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: rgba(0,0,0,0.3);
        }
        .xp-bar-fill {
            height: 100%; background: linear-gradient(90deg, #a29bfe, #6c5ce7);
            transition: width 0.3s;
        }
        
        /* Overlays */
        .overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(5,10,5,0.94);
            z-index: 50;
            transition: opacity 0.4s;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        #overScreen { display: none; }
        #overScreen.active { display: flex; }
        
        .game-title {
            font-size: 56px; font-weight: 900;
            background: linear-gradient(180deg, #55efc4, #00b894);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 30px rgba(0,184,148,0.2);
            letter-spacing: 8px; margin-bottom: 10px;
            animation: titlePulse 3s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .game-sub {
            color: #636e72; font-size: 16px;
            margin-bottom: 40px; letter-spacing: 3px;
        }
        .btn {
            padding: 16px 52px; font-size: 18px;
            border: none; border-radius: 30px;
            cursor: pointer; font-family: inherit;
            font-weight: bold; letter-spacing: 4px;
            transition: all 0.3s; pointer-events: all;
            position: relative; overflow: hidden;
        }
        .btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .btn:hover::after { transform: translateX(100%); }
        .btn-green {
            background: linear-gradient(135deg, #00b894, #55efc4);
            color: #0a0a14; box-shadow: 0 4px 25px rgba(0,184,148,0.4);
        }
        .btn-green:hover { transform: translateY(-3px); box-shadow: 0 8px 35px rgba(0,184,148,0.6); }
        .btn-red {
            background: linear-gradient(135deg, #d63031, #ff7675);
            color: white; box-shadow: 0 4px 25px rgba(214,48,49,0.4);
        }
        .btn-red:hover { transform: translateY(-3px); box-shadow: 0 8px 35px rgba(214,48,49,0.6); }
        
        .controls {
            margin-top: 32px; color: #74b9ff;
            font-size: 13px; text-align: center; line-height: 2.4;
        }
        .key {
            display: inline-block; background: rgba(255,255,255,0.06);
            padding: 3px 12px; border-radius: 6px;
            color: #dfe6e9; font-family: monospace; margin: 0 4px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        /* Toast */
        #toast {
            position: absolute; top: 65px; left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(0,0,0,0.85);
            color: #ffeaa7; padding: 10px 26px;
            border-radius: 24px; font-size: 15px;
            opacity: 0; transition: all 0.3s;
            pointer-events: none; white-space: nowrap;
            border: 1px solid rgba(255,234,167,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-weight: 500;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        /* Stats Grid */
        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin: 20px 0; text-align: center;
        }
        .stat-item { color: #b2bec3; font-size: 14px; }
        .stat-num { color: #fdcb6e; font-size: 32px; font-weight: bold; margin-top: 4px; }
        
        /* Combo Display */
        #comboDisplay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px; font-weight: 900;
            color: #fdcb6e; pointer-events: none;
            opacity: 0; text-shadow: 0 0 30px rgba(253,203,110,0.5);
            transition: all 0.3s; z-index: 20;
        }
        #comboDisplay.show { opacity: 1; animation: comboPop 0.5s ease-out; }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Damage Numbers */
        .damage-num {
            position: absolute; pointer-events: none;
            font-weight: bold; font-size: 18px;
            animation: floatUp 1s ease-out forwards;
            z-index: 15; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }
        
        /* Sound Toggle */
        #soundToggle {
            position: absolute; bottom: 14px; right: 14px;
            z-index: 20; pointer-events: all;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 8px 14px;
            border-radius: 20px; cursor: pointer;
            font-size: 12px; backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        #soundToggle:hover { background: rgba(255,255,255,0.1); }
        
        /* Screen Shake */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-3px, -3px); }
            20% { transform: translate(3px, 3px); }
            30% { transform: translate(-3px, 3px); }
            40% { transform: translate(3px, -3px); }
            50% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, -2px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
        
        /* Level Up Flash */
        @keyframes levelFlash {
            0% { box-shadow: inset 0 0 0 rgba(253,203,110,0); }
            50% { box-shadow: inset 0 0 80px rgba(253,203,110,0.3); }
            100% { box-shadow: inset 0 0 0 rgba(253,203,110,0); }
        }
        .level-up-flash { animation: levelFlash 0.6s ease-out; }
    </style>
<base target="_blank">
</head>
<body>
    <div id="gameBox">
        <canvas id="c" width="960" height="640"></canvas>
        
        <div id="ui">
            <div style="display:flex;gap:10px;flex-direction:column;">
                <div class="ui-panel" id="hpPanel">
                    <span style="color:#ff6b6b;font-size:18px;">♥</span>
                    <div class="bar"><div class="bar-fill hp-fill" id="hpBar" style="width:100%"></div></div>
                    <span id="hpText" style="min-width:40px;text-align:right;font-weight:bold;">100</span>
                </div>
                <div class="ui-panel">
                    <span style="color:#feca57;font-size:18px;">⚡</span>
                    <div class="bar"><div class="bar-fill energy-fill" id="enBar" style="width:100%"></div></div>
                </div>
                <div class="ui-panel" style="padding:4px 12px;">
                    <span style="color:#a29bfe;font-size:12px;">EXP</span>
                    <div class="bar" style="width:100px;height:6px;"><div class="bar-fill xp-fill" id="xpBar" style="width:0%"></div></div>
                </div>
            </div>
            <div style="display:flex;gap:10px;flex-direction:column;align-items:flex-end;">
                <div class="ui-panel">
                    <span style="color:#a29bfe;">LV.</span>
                    <span id="lvl" style="font-weight:bold;font-size:18px;">1</span>
                </div>
                <div class="ui-panel">
                    <span style="color:#fdcb6e;">★</span>
                    <span id="score" style="font-weight:bold;font-size:16px;">0</span>
                </div>
                <div class="ui-panel" id="comboPanel" style="opacity:0;transition:opacity 0.3s;">
                    <span style="color:#ff7675;">🔥</span>
                    <span id="comboCount" style="font-weight:bold;color:#ff7675;">0</span>
                    <span style="font-size:11px;color:#b2bec3;">连击</span>
                </div>
            </div>
        </div>
        
        <div id="toast"></div>
        <div id="comboDisplay"></div>
        <button id="soundToggle">🔊 音效: 开</button>
        
        <div id="overlay" class="overlay">
            <div class="game-title">恐龙岛：生存进化</div>
            <div class="game-sub">手绘恐龙 · 开放世界 · 生存进化</div>
            <button class="btn btn-green" id="startBtn">进入岛屿</button>
            <div class="controls">
                <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动 &nbsp;
                <span class="key">空格</span> 冲刺 &nbsp;
                <span class="key">J</span> 攻击<br>
                收集浆果和水晶，击败掠食者，进化你的恐龙！
            </div>
        </div>
        
        <div id="overScreen" class="overlay">
            <div style="font-size:44px;color:#ff7675;margin-bottom:12px;font-weight:900;">你倒下了</div>
            <div class="stat-grid" style="width:300px;">
                <div class="stat-item">得分<div class="stat-num" id="endScore">0</div></div>
                <div class="stat-item">等级<div class="stat-num" id="endLvl">1</div></div>
                <div class="stat-item">击杀<div class="stat-num" id="endKill">0</div></div>
                <div class="stat-item">生存<div class="stat-num" id="endTime">0s</div></div>
                <div class="stat-item">最高连击<div class="stat-num" id="endCombo">0</div></div>
                <div class="stat-item">水晶<div class="stat-num" id="endCrystal">0</div></div>
            </div>
            <button class="btn btn-red" id="restartBtn">重新开始</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const gameBox = document.getElementById('gameBox');

// ========== 音频系统 ==========
const AudioSys = {
    ctx: null,
    enabled: true,
    bgmOsc: null,
    bgmGain: null,
    
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    
    toggle() {
        this.enabled = !this.enabled;
        document.getElementById('soundToggle').textContent = this.enabled ? '🔊 音效: 开' : '🔇 音效: 关';
        if (!this.enabled && this.bgmGain) {
            this.bgmGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
        } else if (this.enabled && this.bgmGain) {
            this.bgmGain.gain.setTargetAtTime(0.08, this.ctx.currentTime, 0.1);
        }
        return this.enabled;
    },
    
    // 打击音效
    playHit() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.15);
        
        // 噪声层
        const bufferSize = this.ctx.sampleRate * 0.1;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.1, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        noise.connect(noiseGain).connect(this.ctx.destination);
        noise.start(t);
    },
    
    // 收集浆果
    playCollect() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + i * 0.05);
            gain.gain.setValueAtTime(0.15, t + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.05 + 0.2);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t + i * 0.05); osc.stop(t + i * 0.05 + 0.2);
        });
    },
    
    // 收集水晶
    playCrystal() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        [880, 1100, 1320, 1760].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + i * 0.06);
            gain.gain.setValueAtTime(0.12, t + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.06 + 0.4);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.4);
        });
    },
    
    // 受伤
    playHurt() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.3);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.3);
    },
    
    // 升级
    playLevelUp() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t + i * 0.12);
            gain.gain.setValueAtTime(0.2, t + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.12 + 0.4);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.4);
        });
    },
    
    // 敌人死亡
    playDeath() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.4);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.4);
        
        // 爆炸噪声
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.15, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        noise.connect(noiseGain).connect(this.ctx.destination);
        noise.start(t);
    },
    
    // 脚步声
    playStep() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.08);
    },
    
    // 背景音乐
    startBGM() {
        if (!this.enabled || !this.ctx) return;
        if (this.bgmOsc) return;
        
        const t = this.ctx.currentTime;
        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.setValueAtTime(0.08, t);
        this.bgmGain.connect(this.ctx.destination);
        
        // 低频节奏
        const createDrone = (freq, detune) => {
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            osc.detune.setValueAtTime(detune, t);
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.5, t);
            osc.connect(g).connect(this.bgmGain);
            osc.start(t);
            return osc;
        };
        
        this.bgmOsc = [
            createDrone(55, 0),
            createDrone(55.5, 10),
            createDrone(110, 0)
        ];
        
        // 节奏调制
        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(0.5, t);
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.setValueAtTime(0.03, t);
        lfo.connect(lfoGain).connect(this.bgmGain.gain);
        lfo.start(t);
        this.bgmOsc.push(lfo);
    },
    
    stopBGM() {
        if (this.bgmOsc) {
            this.bgmOsc.forEach(o => { try { o.stop(); } catch(e) {} });
            this.bgmOsc = null;
        }
    }
};

document.getElementById('soundToggle').addEventListener('click', () => AudioSys.toggle());

// ========== 世界 ==========
const WORLD = { w: 3000, h: 2000 };
let cam = { x: 0, y: 0 };
let camShake = { x: 0, y: 0, intensity: 0 };

// ========== 输入 ==========
const keys = {};
window.addEventListener('keydown', e => { 
    keys[e.key.toLowerCase()] = true; 
    if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key)) e.preventDefault(); 
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ========== 游戏状态 ==========
let state = 'menu';
let frame = 0;
let score = 0, kills = 0, level = 1, xp = 0, xpNeed = 100;
let surviveTime = 0, crystalsCollected = 0;
let combo = 0, maxCombo = 0, comboTimer = 0;
let damageNumbers = [];

// ========== 工具 ==========
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rand(a, b) { return Math.random() * (b - a) + a; }
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
}

function addDamageNumber(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'damage-num';
    el.textContent = text;
    el.style.color = color;
    el.style.left = (canvas.getBoundingClientRect().left + x - cam.x) + 'px';
    el.style.top = (canvas.getBoundingClientRect().top + y - cam.y) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function screenShake(intensity) {
    camShake.intensity = intensity;
}

// ========== 绘制恐龙 ==========
function drawDino(ctx, x, y, dir, anim, type, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir === 'left' ? -scale : scale, scale);
    
    const t = anim;
    const walk = Math.sin(t * 8) * 0.3;
    const shadowScale = 1 + Math.sin(t * 4) * 0.05;
    
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 18, 20 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
    
    if (type === 'player') {
        // 尾巴
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.moveTo(-18, 5);

// ========== 环境绘制 ==========
function drawBerry(ctx, x, y, t) {
    const bob = Math.sin(t * 3) * 2;
    ctx.save();
    ctx.translate(x, y + bob);
    
    // 光晕
    ctx.fillStyle = `rgba(231, 76, 60, ${0.1 + Math.sin(t * 4) * 0.05})`;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(-6, 4, 6, 0, Math.PI * 2);
    ctx.arc(6, 4, 6, 0, Math.PI * 2);
    ctx.arc(0, -2, 8, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(-4, 0, 3, 0, Math.PI * 2);
    ctx.arc(4, 2, 3, 0, Math.PI * 2);
    ctx.arc(0, -4, 3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#f5b7b1';
    ctx.beginPath();
    ctx.arc(-5, -1, 1, 0, Math.PI * 2);
    ctx.arc(3, 1, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawCrystal(ctx, x, y, t) {
    const bob = Math.sin(t * 4) * 3;
    const glow = 0.5 + Math.sin(t * 6) * 0.5;
    ctx.save();
    ctx.translate(x, y + bob);
    
    // 外发光
    const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
    grad.addColorStop(0, `rgba(155, 89, 182, ${glow * 0.4})`);
    grad.addColorStop(1, 'rgba(155, 89, 182, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    
    // 星芒
    ctx.strokeStyle = `rgba(187, 143, 206, ${glow * 0.6})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
        const ang = (i / 4) * Math.PI + t * 0.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * 8, Math.sin(ang) * 8);
        ctx.lineTo(Math.cos(ang) * 20, Math.sin(ang) * 20);
        ctx.stroke();
    }
    
    ctx.fillStyle = '#9b59b6';
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(8, -4);
    ctx.lineTo(5, 10);
    ctx.lineTo(-5, 10);
    ctx.lineTo(-8, -4);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = '#bb8fce';
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(8, -4);
    ctx.lineTo(0, 2);
    ctx.closePath();
    ctx.fill();
    
    // 高光点
    ctx.fillStyle = `rgba(255,255,255,${glow * 0.8})`;
    ctx.beginPath();
    ctx.arc(-2, -8, 2, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawTree(ctx, x, y, type, swayOffset = 0) {
    ctx.save();
    ctx.translate(x, y);
    const sway = Math.sin(frame * 0.02 + swayOffset) * 0.08;
    
    if (type === 'palm') {
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(-3, 0, 6, 30);
        ctx.fillStyle = '#6D4C41';
        ctx.fillRect(-3, 0, 2, 30);
        
        ctx.fillStyle = '#2ecc71';
        for (let i = 0; i < 6; i++) {
            const ang = (i / 6) * Math.PI * 2 + sway;
            ctx.beginPath();
            ctx.ellipse(Math.cos(ang) * 14, Math.sin(ang) * 6 - 5, 12, 4, ang, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.fillStyle = '#5D4037';
        ctx.beginPath();
        ctx.arc(-3, 2, 3, 0, Math.PI * 2);
        ctx.arc(3, 2, 3, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-3, 10, 6, 20);
        
        ctx.save();
        ctx.rotate(sway * 0.3);
        ctx.fillStyle = '#1e8449';
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(-16, 8);
        ctx.lineTo(16, 8);
        ctx.fill();
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(-13, 14);
        ctx.lineTo(13, 14);
        ctx.fill();
        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(-10, 20);
        ctx.lineTo(10, 20);
        ctx.fill();
        ctx.restore();
    }
    ctx.restore();
}

function drawRock(ctx, x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(3, 4, size, size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#7f8c8d';
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#95a5a6';
    ctx.beginPath();
    ctx.ellipse(-size * 0.2, -size * 0.1, size * 0.6, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.ellipse(-size * 0.1, -size * 0.2, size * 0.3, size * 0.15, -0.3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawFlower(ctx, x, y, t, type) {
    ctx.save();
    ctx.translate(x, y);
    const sway = Math.sin(t * 2 + x) * 0.1;
    ctx.rotate(sway);
    
    // 茎
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(2, -6, 0, -12);
    ctx.stroke();
    
    // 花瓣
    const colors = ['#ffeaa7', '#fd79a8', '#a29bfe', '#74b9ff'];
    ctx.fillStyle = colors[type % colors.length];
    for (let i = 0; i < 5; i++) {
        const ang = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(ang) * 4, -12 + Math.sin(ang) * 4, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // 花心
    ctx.fillStyle = '#fdcb6e';
    ctx.beginPath();
    ctx.arc(0, -12, 2.5, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawGrass(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    const wind = Math.sin(t * 3 + x * 0.1) * 0.15;
    
    ctx.strokeStyle = `rgba(46, 204, 113, ${0.4 + Math.sin(x) * 0.2})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(2 + wind * 5, -6, wind * 8, -10);
    ctx.stroke();
    
    ctx.strokeStyle = `rgba(39, 174, 96, ${0.3 + Math.sin(x) * 0.15})`;
    ctx.beginPath();
    ctx.moveTo(3, 0);
    ctx.quadraticCurveTo(5 + wind * 4, -5, 3 + wind * 6, -8);
    ctx.stroke();
    
    ctx.restore();
}

// ========== 玩家 ==========
const player = {
    x: WORLD.w / 2, y: WORLD.h / 2,
    w: 30, h: 30,
    hp: 100, maxHp: 100,
    energy: 100,
    dir: 'right',
    moving: false,
    anim: 0,
    atkCooldown: 0,
    invincible: 0,
    dmg: 15,
    stepTimer: 0
};

// ========== 对象池 ==========
let berries = [], crystals = [], enemies = [], treesArr = [], rocks = [], particles = [];
let flowers = [], grasses = [];

function initWorld() {
    berries = []; crystals = []; enemies = []; treesArr = []; rocks = []; particles = [];
    flowers = []; grasses = [];
    
    for (let i = 0; i < 120; i++) {
        treesArr.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50),
            type: Math.random() > 0.5 ? 'palm' : 'pine',
            swayOffset: Math.random() * Math.PI * 2
        });
    }
    for (let i = 0; i < 40; i++) {
        rocks.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50),
            size: rand(12, 28)
        });
    }
    for (let i = 0; i < 80; i++) {
        flowers.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50),
            type: Math.floor(Math.random() * 4)
        });
    }
    for (let i = 0; i < 200; i++) {
        grasses.push({
            x: rand(50, WORLD.w - 50),
            y: rand(50, WORLD.h - 50)
        });
    }
    for (let i = 0; i < 25; i++) spawnBerry();
    for (let i = 0; i < 8; i++) spawnCrystal();
    for (let i = 0; i < 5; i++) spawnEnemy();
}

function spawnBerry() {
    berries.push({ x: rand(50, WORLD.w - 50), y: rand(50, WORLD.h - 50), heal: 8, xp: 5 });
}
function spawnCrystal() {
    crystals.push({ x: rand(50, WORLD.w - 50), y: rand(50, WORLD.h - 50), xp: 30, score: 50 });
}
function spawnEnemy() {
    let ex, ey;
    do {
        ex = rand(50, WORLD.w - 50);
        ey = rand(50, WORLD.h - 50);
    } while (dist({x: ex, y: ey}, player) < 400);
    
    const isTrex = Math.random() < 0.25 + level * 0.05;
    enemies.push({
        x: ex, y: ey,
        w: isTrex ? 50 : 35, h: isTrex ? 50 : 35,
        hp: isTrex ? 80 + level * 15 : 30 + level * 8,
        maxHp: isTrex ? 80 + level * 15 : 30 + level * 8,
        speed: isTrex ? 1.8 : 2.8 + level * 0.1,
        type: isTrex ? 'trex' : 'raptor',
        dir: 'left',
        anim: Math.random() * 10,
        atkCd: 0,
        dmg: isTrex ? 20 : 10,
        flash: 0
    });
}

// ========== 粒子 ==========
function addParticles(x, y, color, count, speed = 3, life = 1) {
    for (let i = 0; i < count; i++) {
        const ang = rand(0, Math.PI * 2);
        const sp = rand(1, speed);
        particles.push({
            x, y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp,
            life: life,
            decay: rand(0.02, 0.05),
            color, size: rand(2, 5),
            gravity: 0.08
        });
    }
}

// ========== 更新 ==========
function update() {
    if (state !== 'playing') return;
    frame++;
    surviveTime++;
    
    // 连击计时器
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
            combo = 0;
            document.getElementById('comboPanel').style.opacity = '0';
        }
    }
    
    // 屏幕震动衰减
    if (camShake.intensity > 0) {
        camShake.x = (Math.random() - 0.5) * camShake.intensity;
        camShake.y = (Math.random() - 0.5) * camShake.intensity;
        camShake.intensity *= 0.9;
        if (camShake.intensity < 0.5) camShake.intensity = 0;
    } else {
        camShake.x = 0; camShake.y = 0;
    }
    
    // 玩家移动
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    
    const sprinting = keys[' '] && player.energy > 0;
    if (sprinting) player.energy = Math.max(0, player.energy - 1.2);
    else player.energy = Math.min(100, player.energy + 0.4);
    
    const spd = sprinting ? 5 : 3;
    if (dx !== 0 || dy !== 0) {
        if (dx && dy) { dx *= 0.707; dy *= 0.707; }
        player.x = clamp(player.x + dx * spd, 20, WORLD.w - 20);
        player.y = clamp(player.y + dy * spd, 20, WORLD.h - 20);
        player.moving = true;
        if (dx > 0) player.dir = 'right';
        if (dx < 0) player.dir = 'left';
        player.anim += 0.016;
        
        // 脚步声
        player.stepTimer++;
        if (player.stepTimer > (sprinting ? 8 : 12)) {
            player.stepTimer = 0;
            AudioSys.playStep();
        }
    } else {
        player.moving = false;
        player.stepTimer = 0;
    }
    
    // 攻击
    if (keys['j'] && player.atkCooldown <= 0) {
        player.atkCooldown = 22;
        AudioSys.playHit();
        
        const atkRange = 65;
        const ax = player.x + (player.dir === 'right' ? 30 : -30);
        const ay = player.y;
        
        let hitSomething = false;
        enemies.forEach((e, i) => {
            if (dist({x: ax, y: ay}, e) < atkRange) {
                hitSomething = true;
                e.hp -= player.dmg;
                e.flash = 6;
                addParticles(e.x, e.y, '#ff6b6b', 10, 4);
                
                // 伤害数字
                const isCrit = Math.random() < 0.15;
                const dmg = isCrit ? Math.floor(player.dmg * 1.5) : player.dmg;
                if (isCrit) e.hp -= Math.floor(player.dmg * 0.5);
                addDamageNumber(e.x, e.y - 20, isCrit ? `暴击 ${dmg}!` : `-${dmg}`, isCrit ? '#fdcb6e' : '#ff7675');
                
                // 击退
                const ang = Math.atan2(e.y - player.y, e.x - player.x);
                e.x += Math.cos(ang) * 35;
                e.y += Math.sin(ang) * 35;
                
                if (e.hp <= 0) {
                    kills++;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    comboTimer = 180;
                    
                    const comboBonus = Math.min(combo * 5, 50);
                    score += (e.type === 'trex' ? 100 : 40) + comboBonus;
                    xp += e.type === 'trex' ? 50 : 20;
                    
                    addParticles(e.x, e.y, '#fdcb6e', 20, 5);
                    AudioSys.playDeath();
                    toast(`${e.type === 'trex' ? '霸王龙' : '迅猛龙'} 被击败！${combo > 1 ? ` ${combo}连击!` : ''}`);
                    
                    if (combo >= 3) {
                        document.getElementById('comboPanel').style.opacity = '1';
                        document.getElementById('comboCount').textContent = combo;
                        const cd = document.getElementById('comboDisplay');
                        cd.textContent = `${combo} 连击!`;
                        cd.classList.add('show');
                        setTimeout(() => cd.classList.remove('show'), 800);
                    }
                    
                    enemies.splice(i, 1);
                    screenShake(6);
                }
            }
        });
        
        if (!hitSomething) {
            addParticles(ax, ay, 'rgba(255,255,255,0.5)', 4, 2);
        }
    }
    if (player.atkCooldown > 0) player.atkCooldown--;
    if (player.invincible > 0) player.invincible--;
    
    // 平滑相机
    const targetCamX = player.x - W / 2;
    const targetCamY = player.y - H / 2;
    cam.x += (targetCamX - cam.x) * 0.12;
    cam.y += (targetCamY - cam.y) * 0.12;
    cam.x = clamp(cam.x, 0, WORLD.w - W);
    cam.y = clamp(cam.y, 0, WORLD.h - H);
    
    // 收集
    for (let i = berries.length - 1; i >= 0; i--) {
        if (dist(player, berries[i]) < 32) {
            player.hp = Math.min(player.maxHp, player.hp + berries[i].heal);
            xp += berries[i].xp;
            score += 10;
            addParticles(berries[i].x, berries[i].y, '#ff6b6b', 8, 3);
            AudioSys.playCollect();
            toast(`+${berries[i].xp} XP  +${berries[i].heal} HP`);
            berries.splice(i, 1);
        }
    }
    for (let i = crystals.length - 1; i >= 0; i--) {
        if (dist(player, crystals[i]) < 32) {
            xp += crystals[i].xp;
            score += crystals[i].score;
            crystalsCollected++;
            addParticles(crystals[i].x, crystals[i].y, '#a29bfe', 15, 4);
            AudioSys.playCrystal();
            toast(`💎 +${crystals[i].score} 分！`);
            crystals.splice(i, 1);
        }
    }
    
    // 敌人AI
    enemies.forEach(e => {
        const d = dist(player, e);
        e.anim += 0.016;
        if (e.flash > 0) e.flash--;
        
        if (d < 400) {
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(ang) * e.speed;
            e.y += Math.sin(ang) * e.speed;
            e.dir = Math.cos(ang) > 0 ? 'right' : 'left';
            
            if (d < 38 && e.atkCd <= 0 && player.invincible <= 0) {
                player.hp -= e.dmg;
                player.invincible = 60;
                e.atkCd = 45;
                addParticles(player.x, player.y, '#ff7675', 12, 4);
                AudioSys.playHurt();
                toast(`受到 ${e.dmg} 点伤害！`);
                screenShake(8);
                gameBox.classList.add('shake');
                setTimeout(() => gameBox.classList.remove('shake'), 300);
            }
        } else {
            e.x += Math.cos(e.anim) * e.speed * 0.3;
            e.y += Math.sin(e.anim * 0.7) * e.speed * 0.3;
            e.dir = Math.cos(e.anim) > 0 ? 'right' : 'left';
        }
        if (e.atkCd > 0) e.atkCd--;
        
        e.x = clamp(e.x, 20, WORLD.w - 20);
        e.y = clamp(e.y, 20, WORLD.h - 20);
    });
    
    // 升级
    if (xp >= xpNeed) {
        level++;
        xp -= xpNeed;
        xpNeed = Math.floor(xpNeed * 1.35);
        player.maxHp += 15;
        player.hp = player.maxHp;
        player.dmg += 4;
        AudioSys.playLevelUp();
        toast(`🎉 升级到 Lv.${level}！全属性提升！`);
        addParticles(player.x, player.y, '#fdcb6e', 25, 6);
        gameBox.classList.add('level-up-flash');
        setTimeout(() => gameBox.classList.remove('level-up-flash'), 600);
    }
    
    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0.1;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // 生成
    if (frame % 120 === 0 && berries.length < 30) spawnBerry();
    if (frame % 350 === 0 && crystals.length < 10) spawnCrystal();
    if (frame % 200 === 0 && enemies.length < 6 + level * 0.8) spawnEnemy();
    
    // 死亡
    if (player.hp <= 0) {
        state = 'over';
        AudioSys.stopBGM();
        document.getElementById('endScore').textContent = score;
        document.getElementById('endLvl').textContent = level;
        document.getElementById('endKill').textContent = kills;
        document.getElementById('endTime').textContent = Math.floor(surviveTime / 60) + 's';
        document.getElementById('endCombo').textContent = maxCombo;
        document.getElementById('endCrystal').textContent = crystalsCollected;
        document.getElementById('overScreen').classList.add('active');
    }
    
    // UI
    document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('hpText').textContent = Math.ceil(player.hp);
    document.getElementById('enBar').style.width = player.energy + '%';
    document.getElementById('xpBar').style.width = (xp / xpNeed * 100) + '%';
    document.getElementById('lvl').textContent = level;
    document.getElementById('score').textContent = score;
}

// ========== 绘制 ==========
function draw() {
    // 背景
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(0, 0, W, H);
    
    // 草地纹理
    ctx.fillStyle = 'rgba(46, 125, 50, 0.25)';
    for (let x = -((cam.x + camShake.x) % 80); x < W; x += 80) {
        for (let y = -((cam.y + camShake.y) % 80); y < H; y += 80) {
            if ((Math.floor((x + cam.x) / 80) + Math.floor((y + cam.y) / 80)) % 2 === 0) {
                ctx.fillRect(x, y, 40, 40);
            }
        }
    }
    
    ctx.save();
    ctx.translate(-cam.x - camShake.x, -cam.y - camShake.y);
    
    // 世界边界
    ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)';
    ctx.lineWidth = 5;
    ctx.setLineDash([16, 10]);
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
    ctx.setLineDash([]);
    
    // 草丛（底层）
    grasses.forEach(g => {
        if (g.y < player.y - 50) drawGrass(ctx, g.x, g.y, frame * 0.05);
    });
    
    // 花朵（底层）
    flowers.forEach(f => {
        if (f.y < player.y - 20) drawFlower(ctx, f.x, f.y, frame * 0.05, f.type);
    });
    
    // 树木（下层）
    treesArr.forEach(t => {
        if (t.y < player.y) drawTree(ctx, t.x, t.y, t.type, t.swayOffset);
    });
    
    // 岩石
    rocks.forEach(r => drawRock(ctx, r.x, r.y, r.size));
    
    // 浆果
    berries.forEach(b => drawBerry(ctx, b.x, b.y, frame * 0.05));
    
    // 水晶
    crystals.forEach(c => drawCrystal(ctx, c.x, c.y, frame * 0.05));
    
    // 敌人
    enemies.forEach(e => {
        if (e.flash > 0 && Math.floor(e.flash / 2) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        drawDino(ctx, e.x, e.y, e.dir, e.anim, e.type);
        ctx.globalAlpha = 1;
        
        // 血条
        const hpPct = e.hp / e.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(e.x - 20, e.y - 38, 40, 5);
        ctx.fillStyle = hpPct > 0.5 ? '#00b894' : hpPct > 0.25 ? '#fdcb6e' : '#d63031';
        ctx.fillRect(e.x - 20, e.y - 38, 40 * hpPct, 5);
        // 血条高光
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(e.x - 20, e.y - 38, 40 * hpPct, 2);
    });
    
    // 玩家
    if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
        drawDino(ctx, player.x, player.y, player.dir, player.anim, 'player');
        
        // 攻击特效
        if (player.atkCooldown > 16) {
            ctx.save();
            ctx.translate(player.x, player.y);
            const ax = player.dir === 'right' ? 38 : -38;
            ctx.strokeStyle = `rgba(255,255,255,${(player.atkCooldown - 16) / 9 * 0.8})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ax, -5, 28, -0.5, 0.5);
            ctx.stroke();
            
            //  slash effect
            ctx.strokeStyle = `rgba(255,255,255,${(player.atkCooldown - 16) / 9 * 0.4})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ax - 15, -20);
            ctx.lineTo(ax + 20, 5);
            ctx.stroke();
            ctx.restore();
        }
    }
    
    // 花朵（上层）
    flowers.forEach(f => {
        if (f.y >= player.y - 20) drawFlower(ctx, f.x, f.y, frame * 0.05, f.type);
    });
    
    // 草丛（上层）
    grasses.forEach(g => {
        if (g.y >= player.y - 50) drawGrass(ctx, g.x, g.y, frame * 0.05);
    });
    
    // 树木（上层）
    treesArr.forEach(t => {
        if (t.y >= player.y) drawTree(ctx, t.x, t.y, t.type, t.swayOffset);
    });
    
    // 粒子
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    ctx.restore();
    
    // 小地图
    drawMinimap();
    
    // 暗角 vignette
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
}

function drawMinimap() {
    const mx = W - 135, my = H - 135, mw = 110, mh = 110;
    
    // 背景
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.roundRect(mx - 6, my - 6, mw + 12, mh + 12, 8);
    ctx.fill();
    
    ctx.fillStyle = '#1a3a1a';
    ctx.beginPath();
    ctx.roundRect(mx, my, mw, mh, 6);
    ctx.fill();
    
    const sx = mw / WORLD.w, sy = mh / WORLD.h;
    
    // 树木（小点）
    ctx.fillStyle = 'rgba(46, 204, 113, 0.3)';
    treesArr.forEach(t => {
        ctx.fillRect(mx + t.x * sx, my + t.y * sy, 1.5, 1.5);
    });
    
    // 玩家
    ctx.fillStyle = '#55efc4';
    ctx.beginPath();
    ctx.arc(mx + player.x * sx, my + player.y * sy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // 敌人
    enemies.forEach(e => {
        ctx.fillStyle = e.type === 'trex' ? '#d63031' : '#e17055';
        ctx.beginPath();
        ctx.arc(mx + e.x * sx, my + e.y * sy, e.type === 'trex' ? 3 : 2, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // 物品
    ctx.fillStyle = '#fdcb6e';
    berries.forEach(b => {
        ctx.fillRect(mx + b.x * sx - 0.5, my + b.y * sy - 0.5, 1.5, 1.5);
    });
    ctx.fillStyle = '#a29bfe';
    crystals.forEach(c => {
        ctx.fillRect(mx + c.x * sx - 1, my + c.y * sy - 1, 2.5, 2.5);
    });
    
    // 视窗框
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(mx + cam.x * sx, my + cam.y * sy, W * sx, H * sy);
}

// ========== 循环 ==========
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// ========== 开始 ==========
document.getElementById('startBtn').addEventListener('click', () => {
    AudioSys.init();
    AudioSys.startBGM();
    document.getElementById('overlay').classList.add('hidden');
    state = 'playing';
    initWorld();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    location.reload();
});

loop();
</script>
